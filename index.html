<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div>
      <p class="display-calculation calculation">0</p>
    </div>
    
    <div>
      <button class="calculator-button gray-button" value="1">1</button>

      <button class="calculator-button gray-button" value="2">2</button>

      <button class="calculator-button gray-button" value="3">3</button>

      <button class="calculator-button orange-button" value="+">+</button>
    </div>

    <div>
      <button class="calculator-button gray-button" value="4">4</button>

      <button class ="calculator-button gray-button" value="5">5</button>

      <button class="calculator-button gray-button" value="6">6</button>

      <button class="calculator-button orange-button" value="-">-</button>
    </div>

    <div>
      <button class="calculator-button gray-button" value="7">7</button>

      <button class="calculator-button gray-button" value="8">8</button>

      <button class="calculator-button gray-button" value="9">9</button>

      <button class="calculator-button orange-button" value="*">*</button>
    </div>

    <div>
      <button class="calculator-button gray-button" value="0">0</button>

      <button class="calculator-button gray-button" value=".">.</button>

      <button class="equal-sign gray-button">=</button>

      <button class="calculator-button orange-button" value="/">/</button>
    </div>

    <div>
      <button class="gray-button clear-button">Clear</button>
   </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
