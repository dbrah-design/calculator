<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div>
      <p class="display-calculation calculation">0</p>
    </div>
    
    <div>
      <button class="calculator-button gray-button js-number-btn js-number-btn" value="1">1</button>

      <button class="calculator-button gray-button js-number-btn" value="2">2</button>

      <button class="calculator-button gray-button js-number-btn" value="3">3</button>

      <button class="calculator-button orange-button js-operator-btn" value="+">+</button>
    </div>

    <div>
      <button class="calculator-button gray-button js-number-btn" value="4">4</button>

      <button class ="calculator-button gray-button js-number-btn" value="5">5</button>

      <button class="calculator-button gray-button js-number-btn" value="6">6</button>

      <button class="calculator-button orange-button js-operator-btn" value="-">-</button>
    </div>

    <div>
      <button class="calculator-button gray-button js-number-btn" value="7">7</button>

      <button class="calculator-button gray-button js-number-btn" value="8">8</button>

      <button class="calculator-button gray-button js-number-btn" value="9">9</button>

      <button class="calculator-button orange-button js-operator-btn" value="*">*</button>
    </div>

    <div>
      <button class="calculator-button gray-button js-number-btn" value="0">0</button>
      <button class="gray-button clear-button js-clear-btn">Clear</button>
      <button class="equal-btn gray-button js-equal-btn">=</button>
      <button class="calculator-button orange-button js-operator-btn" value="/">/</button>

    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
